server {
    listen 80;
    server_name _;
    root /var/www/html/life-Insurance;
    index index.php;

    charset utf-8;
    server_tokens off;

    client_max_body_size 5m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 検索エンジンへの登録を全面的に禁止します。
    # PHP を経由しない静的ファイル（CSS・JS・画像）やエラー応答にも付与するため、
    # server ブロックで always 付きで指定します。
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ブラウザやブックマークはルート直下の /favicon.ico を直接要求します。
    # 実体は images/ にあるため、そこへ読み替えます。
    location = /favicon.ico {
        alias /var/www/html/life-Insurance/images/favicon.ico;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
